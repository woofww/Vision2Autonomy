<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">卷积的四个直觉步骤</title><desc id="desc">窗口覆盖像素，对应相乘，乘积相加，结果写入输出中心。</desc>
  <rect width="1200" height="420" rx="24" fill="#f4f6f4"/>
  <style>text{font-family:Inter,"Microsoft YaHei",sans-serif;fill:#18211f}.label{font-size:18px;font-weight:700}.note{font-size:14px;fill:#63706c}.cell{fill:#fff;stroke:#dce3df;stroke-width:2}.center{fill:#dcebe7;stroke:#315f57}.kernel{fill:#edf1ef}.accent{fill:#315f57}.arrow{stroke:#8a9a95;stroke-width:3;fill:none;marker-end:url(#head)}</style>
  <defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a9a95"/></marker></defs>
  <text x="40" y="42" class="label">1. 小窗口盖住局部像素</text>
  <g transform="translate(55 75)"><rect class="cell" width="58" height="58" rx="8"/><rect class="cell" x="62" width="58" height="58" rx="8"/><rect class="cell" x="124" width="58" height="58" rx="8"/><rect class="cell" y="62" width="58" height="58" rx="8"/><rect class="cell center" x="62" y="62" width="58" height="58" rx="8"/><rect class="cell" x="124" y="62" width="58" height="58" rx="8"/><rect class="cell" y="124" width="58" height="58" rx="8"/><rect class="cell" x="62" y="124" width="58" height="58" rx="8"/><rect class="cell" x="124" y="124" width="58" height="58" rx="8"/><g text-anchor="middle" font-size="18" font-weight="700"><text x="29" y="36">10</text><text x="91" y="36">10</text><text x="153" y="36">10</text><text x="29" y="98">10</text><text x="91" y="98">50</text><text x="153" y="98">10</text><text x="29" y="160">10</text><text x="91" y="160">10</text><text x="153" y="160">10</text></g></g>
  <text x="75" y="290" class="note">一次只观察一个局部邻域</text><path class="arrow" d="M255 165 H320"/>
  <text x="340" y="42" class="label">2. 对应位置分别相乘</text>
  <g transform="translate(355 75)"><rect class="kernel" stroke="#dce3df" width="182" height="182" rx="12"/><g text-anchor="middle" font-size="17"><text x="30" y="36">0</text><text x="91" y="36">−1</text><text x="152" y="36">0</text><text x="30" y="98">−1</text><text x="91" y="98" class="accent" font-weight="800">5</text><text x="152" y="98">−1</text><text x="30" y="160">0</text><text x="91" y="160">−1</text><text x="152" y="160">0</text></g></g>
  <text x="365" y="290" class="note">卷积核是一张“局部评分规则”</text><path class="arrow" d="M555 165 H620"/>
  <text x="640" y="42" class="label">3. 把所有乘积相加</text><rect x="650" y="100" width="220" height="125" rx="14" fill="#fff" stroke="#dce3df" stroke-width="2"/><text x="760" y="145" text-anchor="middle" font-size="17">5×50 − 4×10</text><line x1="690" y1="166" x2="830" y2="166" stroke="#dce3df" stroke-width="2"/><text x="760" y="203" text-anchor="middle" font-size="32" font-weight="800" class="accent">= 210</text>
  <text x="663" y="290" class="note">九个数字变成一个局部响应</text><path class="arrow" d="M890 165 H955"/>
  <text x="970" y="42" class="label">4. 写入输出中心</text><rect x="1002" y="93" width="132" height="132" rx="16" fill="#fff" stroke="#dce3df" stroke-width="2"/><rect x="1041" y="132" width="54" height="54" rx="10" class="center"/><text x="1068" y="168" text-anchor="middle" font-size="22" font-weight="800">210</text><text x="990" y="290" class="note">再滑到下一个位置，重复计算</text>
  <text x="600" y="380" text-anchor="middle" font-size="17" class="accent">卷积 = 同一套局部规则，在整张图像上滑动执行</text>
</svg>
