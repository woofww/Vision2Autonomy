<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">从三个视角理解卷积</title><desc id="desc">时间视角描述历史输入叠加，空间视角描述邻域像素加权，频率视角描述不同频率分别缩放。</desc>
  <rect width="1200" height="420" rx="24" fill="#f4f6f4"/>
  <style>text{font-family:Inter,"Microsoft YaHei",sans-serif;fill:#18211f}.h{font-size:22px;font-weight:750}.p{font-size:15px;fill:#63706c}.axis{stroke:#9aa8a3;stroke-width:2}.signal{stroke:#315f57;stroke-width:4;fill:none}.response{stroke:#bd7644;stroke-width:4;fill:none}.cell{stroke:#d7e0dc;stroke-width:2;fill:#fff}.hot{fill:#d9ebe6;stroke:#315f57;stroke-width:2}.bar{fill:#315f57}.muted{fill:#b8c9c3}</style>
  <g transform="translate(35 28)"><rect width="350" height="350" rx="18" fill="#fff" stroke="#dce3df"/><text x="24" y="42" class="h">时间：过去怎样影响现在</text><text x="24" y="70" class="p">每次输入都留下一个响应，再在当前时刻相加</text><line x1="35" y1="270" x2="320" y2="270" class="axis"/><line x1="55" y1="290" x2="55" y2="105" class="axis"/><path d="M55 270 L85 155 L100 270 L145 205 L160 270 L220 235 L235 270" class="signal"/><path d="M55 270 C75 120 120 115 160 190 S235 250 315 265" class="response"/><text x="68" y="320" class="p">输入脉冲</text><text x="220" y="320" class="p">系统余响</text></g>
  <g transform="translate(425 28)"><rect width="350" height="350" rx="18" fill="#fff" stroke="#dce3df"/><text x="24" y="42" class="h">空间：邻居怎样决定当前位置</text><text x="24" y="70" class="p">小窗口逐项相乘求和，得到局部响应</text><g transform="translate(72 105)"><rect class="cell" width="62" height="62"/><rect class="cell" x="64" width="62" height="62"/><rect class="cell" x="128" width="62" height="62"/><rect class="cell" y="64" width="62" height="62"/><rect class="hot" x="64" y="64" width="62" height="62"/><rect class="cell" x="128" y="64" width="62" height="62"/><rect class="cell" y="128" width="62" height="62"/><rect class="cell" x="64" y="128" width="62" height="62"/><rect class="cell" x="128" y="128" width="62" height="62"/><text x="95" y="102" text-anchor="middle" font-size="20" font-weight="750">Σ</text></g><text x="73" y="320" class="p">模糊 · 锐化 · 边缘 · 纹理</text></g>
  <g transform="translate(815 28)"><rect width="350" height="350" rx="18" fill="#fff" stroke="#dce3df"/><text x="24" y="42" class="h">频率：不同变化速度怎样被缩放</text><text x="24" y="70" class="p">空间卷积等价于频率分量逐项相乘</text><line x1="40" y1="275" x2="315" y2="275" class="axis"/><rect x="62" y="130" width="34" height="145" class="bar"/><rect x="115" y="165" width="34" height="110" class="bar"/><rect x="168" y="208" width="34" height="67" class="muted"/><rect x="221" y="235" width="34" height="40" class="muted"/><rect x="274" y="251" width="24" height="24" class="muted"/><text x="55" y="320" class="p">低频：缓慢变化</text><text x="215" y="320" class="p">高频：细节/噪声</text></g>
  <text x="600" y="407" text-anchor="middle" font-size="16" fill="#315f57">三个视角描述同一个运算，不是三种不同的卷积</text>
</svg>
